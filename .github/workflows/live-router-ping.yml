name: Live Router Ping

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *' # daily @ 04:23 UTC

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check LIVE_BASE
        id: gate
        run: |
          if [ -z "${{ secrets.LIVE_BASE }}" ]; then
            echo "::notice title=LiveRouter::LIVE_BASE not set; skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
      - name: Curl /healthz
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          curl -fsSL "${{ secrets.LIVE_BASE }}/healthz"
