name: Plan Guard

on:
  pull_request:
    paths:
      - 'docs/plans/OS1-PLAN*.md'
      - 'docs/templates/**'
      - 'ops/check_plan_templates.ps1'
      - '.github/workflows/plan-guard.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/plans/OS1-PLAN*.md'
      - 'docs/templates/**'
      - 'ops/check_plan_templates.ps1'
      - '.github/workflows/plan-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate governing template links
        shell: pwsh
        run: ./ops/check_plan_templates.ps1 -PlanPath 'docs/plans/OS1-PLAN.v2025.09.17.md'

