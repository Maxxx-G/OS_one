name: CI

on:
  push:
    branches: [main, 'feat/*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHON_DIR: archon
jobs:
  python-archon:
    name: Python · Archon Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify archon directory exists
        run: |
          if [ ! -d "$ARCHON_DIR" ]; then
            echo "::notice title=Archon::Directory '$ARCHON_DIR' not found; skipping lint/tests."
            echo "skip" > archon_skip.flag
          fi

      - name: Setup Python
        if: ${{ !hashFiles('archon_skip.flag') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        if: ${{ !hashFiles('archon_skip.flag') }}
        working-directory: ${{ env.ARCHON_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || true

      - name: Lint (ruff/flake8)
        if: ${{ !hashFiles('archon_skip.flag') }}
        working-directory: ${{ env.ARCHON_DIR }}
        run: |
          ruff check .
          flake8 .

      - name: Tests (pytest)
        if: ${{ !hashFiles('archon_skip.flag') }}
        working-directory: ${{ env.ARCHON_DIR }}
        run: |
          pytest -q

  docker-compose-archon:
    name: Docker · Build & Health Check (Archon)
    runs-on: ubuntu-latest
    needs: python-archon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env & mounts
        run: |
          mkdir -p policies/env kb logs
          cat > policies/env/archon_api.env <<'EOF'
          ARCHON_ENV=ci
          ARCHON_PORT=7700
          # (Optionals for later)
          # OPENAI_API_KEY=
          # ANTHROPIC_API_KEY=
          OLLAMA_BASE_URL=http://host.docker.internal:11434
          EOF

      - name: Compose Up (build)
        run: docker compose -f ops/docker_compose_archon_highway_v0.1_04_09_2025.yml up --build -d

      - name: Wait for /healthz
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:7700/healthz >/dev/null; then
              echo "Archon healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Archon did not become healthy in time."
          docker logs osone-archon-api || true
          exit 1

      - name: Show /version
        run: curl -fsS http://localhost:7700/version || true

      - name: Compose Down (cleanup)
        if: always()
        run: docker compose -f ops/docker_compose_archon_highway_v0.1_04_09_2025.yml down -v

  prettier-check:
    name: Format · Prettier (docs/ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm i -D prettier

      - name: Prettier check
        run: npx prettier -c "**/*.{js,ts,tsx,css,md,json,yml,yaml}"
